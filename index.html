<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Mágico - Loja de Brinquedos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFF2B2;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            position: relative;
            width: 820px;
            height: 480px;
        }

        /* Forma principal em SVG para precisão absoluta nas curvas e cantos */
        .main-shape {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            fill: #8C863B;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.15));
        }

        /* Cabeçalho interno da loja */
        .store-header {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFF2B2;
            font-size: 1.4rem;
            font-weight: bold;
            z-index: 2;
            letter-spacing: 1px;
        }

        /* Grade centralizada de cartões de produtos */
        .grid-container {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: grid;
            grid-template-columns: repeat(2, 140px);
            grid-template-rows: repeat(2, 140px);
            gap: 20px;
            z-index: 2;
        }

        .card {
            width: 140px;
            height: 140px;
            background-color: #FFFFFF;
            border-radius: 20px;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: scale(1.04);
            background-color: #FAFAFA;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .card img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .card h3 {
            font-size: 0.85rem;
            color: #333;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .card span {
            font-size: 0.8rem;
            color: #8C863B;
            font-weight: bold;
        }

        /* Rodapé com status do carrinho/Firebase */
        .store-footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFF2B2;
            font-size: 0.85rem;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Elemento principal desenhado via SVG -->
        <svg class="main-shape" viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
            <path d="
                M 36 0 
                H 120 
                Q 135 0 140 12 
                Q 148 30 166 30 
                H 200 
                Q 218 30 226 12 
                Q 231 0 246 0 
                H 724 
                A 36 36 0 0 1 760 36 
                V 384 
                A 36 36 0 0 1 724 420 
                Q 380 370 36 420 
                A 36 36 0 0 1 0 384 
                V 36 
                A 36 36 0 0 1 36 0 
                Z" 
            />
        </svg>

        <div class="store-header">🧸 Loja de Brinquedos Mágicos</div>

        <!-- Grade de Produtos Dinâmica -->
        <div class="grid-container" id="product-grid">
            <!-- Os produtos serão injetados via JavaScript do Firebase -->
            <div class="card" onclick="selectProduct('Carregando...')">
                <h3>Carregando...</h3>
                <span>--</span>
            </div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
        </div>

        <div class="store-footer" id="firebase-status">Conectando ao Firebase...</div>
    </div>

    <!-- Firebase SDKs (Modular Version) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ Substitua com as credenciais do seu projeto Firebase
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const gridContainer = document.getElementById('product-grid');
            const statusEl = document.getElementById('firebase-status');
            
            try {
                gridContainer.innerHTML = '';
                // Supondo que sua coleção no Firestore se chame 'brinquedos'
                const querySnapshot = await getDocs(collection(db, "brinquedos"));
                
                if (querySnapshot.empty) {
                    statusEl.innerText = "Nenhum brinquedo cadastrado no banco.";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const toy = doc.data();
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => selectProduct(toy.nome, toy.preco);
                    
                    card.innerHTML = `
                        <img src="${toy.imagem || 'https://via.placeholder.com/60'}" alt="${toy.nome}">
                        <h3>${toy.nome}</h3>
                        <span>R$ ${Number(toy.preco).toFixed(2)}</span>
                    `;
                    gridContainer.appendChild(card);
                });

                statusEl.innerText = "Catálogo sincronizado com Firebase ✨";
            } catch (error) {
                console.error("Erro ao carregar produtos:", error);
                statusEl.innerText = "Erro ao conectar com o banco de dados.";
            }
        }

        window.selectProduct = function(name, price) {
            if(!price) return;
            alert(`Você selecionou: ${name} por R$ ${Number(price).toFixed(2)}! Adicionado ao carrinho.`);
        }

        // Executar carregamento ao iniciar
        loadProducts();
    </script>
</body>
</html>
