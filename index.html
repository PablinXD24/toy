<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Estilizada - Vetor Preciso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFF2B2;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        .container {
            position: relative;
            width: 760px;
            height: 420px;
        }

        /* Forma principal em SVG para precisão absoluta nas curvas e cantos */
        .main-shape {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            fill: #8C863B;
        }

        /* Grade centralizada de cartões */
        .grid-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: grid;
            grid-template-columns: repeat(2, 110px);
            grid-template-rows: repeat(2, 110px);
            gap: 22px;
            z-index: 2;
        }

        .card {
            width: 110px;
            height: 110px;
            background-color: #FFFFFF;
            border-radius: 22px;
            transition: transform 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.04);
            background-color: #F8F8F8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Elemento principal desenhado via SVG para garantir pontas e arcos perfeitos -->
        <svg class="main-shape" viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
            <path d="
                M 36 0 
                H 120 
                Q 135 0 140 12 
                Q 148 30 166 30 
                H 200 
                Q 218 30 226 12 
                Q 231 0 246 0 
                H 724 
                A 36 36 0 0 1 760 36 
                V 384 
                A 36 36 0 0 1 724 420 
                Q 380 370 36 420 
                A 36 36 0 0 1 0 384 
                V 36 
                A 36 36 0 0 1 36 0 
                Z" 
            />
        </svg>

        <!-- Grade de Cartões Brancos -->
        <div class="grid-container">
            <div class="card" onclick="handleClick(1)"></div>
            <div class="card" onclick="handleClick(2)"></div>
            <div class="card" onclick="handleClick(3)"></div>
            <div class="card" onclick="handleClick(4)"></div>
        </div>
    </div>

    <script>
        function handleClick(cardNumber) {
            const cards = document.querySelectorAll('.card');
            const targetCard = cards[cardNumber - 1];
            
            targetCard.style.transform = 'scale(0.95)';
            setTimeout(() => {
                targetCard.style.transform = 'scale(1)';
            }, 150);
        }
    </script>
</body>
</html>
